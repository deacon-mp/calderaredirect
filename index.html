<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caldera has moved to caldera.apache.org</title>

  <!-- SEO: pass link equity to the new home, keep this stub out of the index -->
  <link rel="canonical" href="https://caldera.apache.org/">
  <meta name="robots" content="noindex, follow">

  <!-- No-JS / crawler redirect -->
  <meta http-equiv="refresh" content="0; url=https://caldera.apache.org/">

  <!-- Immediate redirect; replace() avoids leaving this stub in history -->
  <script>
    (function () {
      var dest = "https://caldera.apache.org/";
      try { window.location.replace(dest); } catch (e) { window.location.href = dest; }
    })();
  </script>

  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         background:#0d1117;color:#c9d1d9;margin:0;min-height:100vh;
         display:flex;align-items:center;justify-content:center;text-align:center}
    .card{max-width:34rem;padding:2rem;line-height:1.5}
    h1{font-size:1.4rem;margin:0 0 .75rem}
    a{color:#58a6ff}
  </style>
</head>
<body>
  <main class="card">
    <h1>Caldera has moved</h1>
    <p>This project now lives at <a href="https://caldera.apache.org/">caldera.apache.org</a>.</p>
    <p>If you are not redirected automatically,
       <a href="https://caldera.apache.org/">click here to continue</a>.</p>
  </main>
</body>
</html>
